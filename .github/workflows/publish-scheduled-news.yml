name: Publish scheduled news

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: publish
        run: |
          npm run news:publish
          if git diff --quiet -- data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.publish.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - if: steps.publish.outputs.changed == 'true'
        run: |
          git config user.name "Thirty Seven News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit \
            --author="$(git log -1 --format='%an <%ae>')" \
            -m "Publish scheduled Thirty Seven news"
          git push origin HEAD:main
