name: Publish scheduled news

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: publish
        run: |
          npm run news:publish
          if git diff --quiet -- data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.publish.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - if: steps.publish.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "Thirty Seven News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit \
            --author="$(git log -1 --format='%an <%ae>')" \
            -m "Publish scheduled Thirty Seven news"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-cloudflare:
    needs: publish
    if: needs.publish.outputs.changed == 'true' && vars.CLOUDFLARE_PREVIEW_ENABLED == 'true'
    uses: ./.github/workflows/cloudflare-deploy.yml
    with:
      environment: ${{ vars.CLOUDFLARE_PRODUCTION_ENABLED == 'true' && 'production' || 'preview' }}
      commit: ${{ needs.publish.outputs.commit }}
    secrets: inherit
